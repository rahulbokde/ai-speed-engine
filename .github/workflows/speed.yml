name: AI speed ping

on:
  schedule:
    # Every 30 minutes (best-effort: GitHub may delay scheduled runs under load).
    - cron: "*/30 * * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write       # allows the job to commit the updated data.json

concurrency:
  group: ai-speed-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Measure LLM speeds
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node ping.mjs

      - name: Commit results
        run: |
          git config user.name "speed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data.json was just regenerated by ping.mjs — keep it safe from the re-sync.
          cp data.json /tmp/data.json
          # Push with retry: if a concurrent run pushed first, GitHub rejects our push
          # ("fetch first"). Re-sync to the latest remote tip, re-apply our fresh data,
          # and try again so the newest measurement always lands — no lost runs.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/data.json data.json
            git add data.json
            git commit -m "chore: update AI speed data [skip ci]" || { echo "No change vs remote — nothing to push."; exit 0; }
            if git push origin main; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Attempt $i lost the push race — re-syncing with remote and retrying…"
            sleep 3
          done
          echo "Could not push after 5 attempts."
          exit 1
